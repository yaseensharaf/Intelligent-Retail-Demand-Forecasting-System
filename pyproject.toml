[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecasting"
version = "0.1.0"
description = "Monthly product-level retail demand forecasting"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
include = ["forecasting*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
extend-exclude = ["notebooks/legacy"]
target-version = "py311"
